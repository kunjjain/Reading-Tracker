<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Reading Tracker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: quiet dark page in moss and sand. Wordmark, a soft hills banner with the reading total, a thin status bar, then a sidebar of filters beside a grid of roomy cards. */
:root {
  --bg: #10130D;
  --surface: #181C12;
  --surface-2: #20261A;
  --ink: #ECEADF;
  --muted: #9CA08E;
  --line: #2A3121;
  --accent: #B9C892;
  --accent-ink: #12150D;
  --reading: #8DB3C7;
  --completed: #B4C98C;
  --hold: #DCBC7C;
  --dropped: #D1918A;
  --plan: #A8A596;
  --sky-top: #1B2216;
  --sky-bottom: #2A3322;
  --hill-1: #323E28;
  --hill-2: #3B4A30;
  --hill-3: #455639;
  --tree: #1E2717;
  --tree-2: #2C3924;
  --font-display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15.5px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 72px;
}
.shell { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.top-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.mark { font-family: var(--font-display); font-weight: 500; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
.who { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.tally { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.linkbtn { background: none; border: 0; padding: 4px 2px; cursor: pointer; color: var(--accent); font-weight: 500; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 4px; }

h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(38px, 7vw, 60px); line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
#app { display: flex; flex-direction: column; gap: 32px; }

/* banner */
.banner { position: relative; overflow: hidden; border-radius: 24px; min-height: clamp(210px, 30vw, 270px); display: grid; place-items: center; padding: 28px 20px; background: linear-gradient(var(--sky-top), var(--sky-bottom)); }
.banner svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.banner .t { fill: var(--tree); } .banner .t2 { fill: var(--tree-2); }
.banner .f { fill: var(--tree); color: var(--tree); }
.banner .h1 { fill: var(--hill-1); } .banner .h2 { fill: var(--hill-2); } .banner .h3 { fill: var(--hill-3); }
.banner-text { position: relative; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.eyebrow { margin: 0; font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; color: color-mix(in srgb, var(--ink) 80%, transparent); font-weight: 500; }
.big { margin: 0; font-family: var(--font-display); font-weight: 300; font-size: clamp(36px, 7.5vw, 64px); line-height: 1.05; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.sub { margin: 0; color: color-mix(in srgb, var(--ink) 82%, transparent); font-size: 15px; }

/* status bar */
.seg { display: flex; gap: 3px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg i { display: block; min-width: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; font-size: 14px; align-items: center; }
.lg { display: inline-flex; gap: 8px; align-items: center; color: var(--ink); }
.lg i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; }
.lg b { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.catch { margin-left: auto; color: var(--muted); }

/* sidebar + content */
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 20px; }
.chips { display: flex; flex-direction: column; gap: 2px; }
.chip { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border: 0; background: none; padding: 12px 14px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; color: var(--muted); }
.chip b { font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.railbtns { display: flex; flex-direction: column; gap: 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.railbtns .btn { justify-content: center; }

.content { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }
input[type=text], input[type=search], input[type=number], input[type=email], input[type=password], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; width: 100%; min-width: 0;
}
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
textarea { resize: vertical; min-height: 72px; }
.toolbar select { width: auto; }
select { color-scheme: dark; }
.btn { display: inline-flex; align-items: center; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 10px 20px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--dropped); }
.btn[disabled] { opacity: .45; cursor: default; }

.panel { background: var(--surface); border-radius: 22px; padding: 24px; }
.panel[hidden] { display: none; }
#login { max-width: 520px; margin: 8vh auto 0; }
form.entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; }
form.entry .wide { grid-column: 1 / -1; }
.f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.f label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.f small { color: var(--muted); font-size: 12.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.card { background: var(--surface); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.name { font-family: var(--font-display); font-weight: 500; font-size: 21px; line-height: 1.2; letter-spacing: -0.005em; margin: 0; overflow-wrap: anywhere; min-width: 0; }
.hero { display: flex; gap: 18px; align-items: flex-start; }
.hero .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.hero .top { flex-direction: column; gap: 10px; align-items: flex-start; }

.pillwrap { position: relative; flex: none; }
.pillwrap::after { content: "▾"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--c); pointer-events: none; }
.pill {
  appearance: none; -webkit-appearance: none; width: auto; cursor: pointer;
  color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface));
  border: 0; border-radius: 999px; padding: 5px 28px 5px 13px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
}
.pill option { color: var(--ink); background: var(--surface); letter-spacing: 0; text-transform: none; }

.cover { width: 104px; flex: none; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: color-mix(in srgb, var(--c, var(--muted)) 14%, var(--surface-2)); display: grid; place-items: center; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover span { font-family: var(--font-display); font-weight: 300; font-size: 40px; color: var(--c, var(--muted)); }
.cover.small { width: 60px; border-radius: 10px; }
.cover.small span { font-size: 24px; }
.coverfield { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.coverfield input[type=file] { width: auto; max-width: 100%; padding: 8px 12px; }

.counter { display: flex; align-items: center; gap: 14px; }
.num { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.num .n { font-family: var(--font-display); font-weight: 300; font-size: 46px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.num .t { font-family: var(--font-display); color: var(--muted); font-size: 17px; font-variant-numeric: tabular-nums; }
.num .l { color: var(--muted); font-size: 13.5px; flex-basis: 100%; }
.step { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: 20px; line-height: 1; cursor: pointer; flex: none; display: grid; place-items: center; }
.step:hover { border-color: var(--muted); }
.step.plus { background: var(--c); color: var(--bg); border-color: var(--c); font-weight: 500; }
.step[disabled] { opacity: .35; cursor: default; }
.bar { height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 999px; }

.tbtn { background: none; border: 0; border-bottom: 1px dashed var(--muted); padding: 0; cursor: pointer; font: inherit; color: var(--muted); }
.tbtn:hover { color: var(--ink); border-bottom-color: var(--ink); }
.tin { width: 88px; padding: 3px 10px; font-family: var(--font-display); font-size: 16px; border-radius: 10px; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 9px; font-size: 12px; cursor: pointer; color: var(--ink); }
.mini:hover { border-color: var(--accent); color: var(--accent); }
.sites { display: flex; flex-wrap: wrap; gap: 6px; }
.site { font-size: 13px; padding: 3px 11px; border-radius: 999px; background: var(--surface-2); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
a.site:hover { color: var(--accent); }
.nosite { color: var(--muted); font-size: 13px; }
.note { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; }
.when { font-size: 12.5px; color: var(--muted); }

.empty { padding: 36px 4px; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.empty strong { color: var(--ink); font-family: var(--font-display); font-weight: 400; font-size: 28px; }
.msg { font-size: 13.5px; color: var(--muted); min-height: 20px; }
.msg.err { color: var(--dropped); }
@media (prefers-reduced-motion: no-preference) {
  .bar i, .seg i { transition: width .3s ease, flex-grow .3s ease; }
  .chip, .btn, .step { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
}

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .rail { position: static; gap: 16px; }
  .chips { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: none; }
  .chip { flex: none; gap: 10px; padding: 10px 16px; border-radius: 999px; background: var(--surface); }
  .railbtns { flex-direction: row; flex-wrap: wrap; padding-top: 0; border-top: 0; }
  .catch { margin-left: 0; flex-basis: 100%; }
}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>


<div class="shell">
  <header class="top-bar">
    <span class="mark">Reading Tracker</span>
    <div class="who"><span class="tally" id="tally"></span><button class="linkbtn" id="signout" type="button" hidden>Sign out</button></div>
  </header>

  <div class="msg" id="msg" role="status"></div>

  <section class="panel" id="login" hidden aria-label="Sign in">
    <form class="entry" id="loginform">
      <p class="note wide">Sign in to see your list.</p>
      <div class="f"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="f"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <div class="actions wide"><button class="btn primary" type="submit">Sign in</button></div>
    </form>
  </section>

  <div id="app" hidden>
    <h1>Welcome back</h1>

    <section class="banner" aria-label="Your reading so far">
      <svg viewBox="0 0 1200 270" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
        <defs><g id="fern"><path d="M0 0 V-132" stroke="currentColor" stroke-width="2.4" fill="none"/><ellipse cx="-9.3" cy="-14" rx="15.0" ry="3.6" transform="rotate(-38 -9.3 -14)"/><ellipse cx="9.3" cy="-14" rx="15.0" ry="3.6" transform="rotate(38 9.3 -14)"/><ellipse cx="-8.6" cy="-27" rx="13.9" ry="3.6" transform="rotate(-38 -8.6 -27)"/><ellipse cx="8.6" cy="-27" rx="13.9" ry="3.6" transform="rotate(38 8.6 -27)"/><ellipse cx="-8.0" cy="-40" rx="12.9" ry="3.6" transform="rotate(-38 -8.0 -40)"/><ellipse cx="8.0" cy="-40" rx="12.9" ry="3.6" transform="rotate(38 8.0 -40)"/><ellipse cx="-7.3" cy="-53" rx="11.8" ry="3.6" transform="rotate(-38 -7.3 -53)"/><ellipse cx="7.3" cy="-53" rx="11.8" ry="3.6" transform="rotate(38 7.3 -53)"/><ellipse cx="-6.7" cy="-66" rx="10.8" ry="3.6" transform="rotate(-38 -6.7 -66)"/><ellipse cx="6.7" cy="-66" rx="10.8" ry="3.6" transform="rotate(38 6.7 -66)"/><ellipse cx="-6.0" cy="-79" rx="9.8" ry="3.6" transform="rotate(-38 -6.0 -79)"/><ellipse cx="6.0" cy="-79" rx="9.8" ry="3.6" transform="rotate(38 6.0 -79)"/><ellipse cx="-5.4" cy="-92" rx="8.7" ry="3.6" transform="rotate(-38 -5.4 -92)"/><ellipse cx="5.4" cy="-92" rx="8.7" ry="3.6" transform="rotate(38 5.4 -92)"/><ellipse cx="-4.7" cy="-105" rx="7.6" ry="3.6" transform="rotate(-38 -4.7 -105)"/><ellipse cx="4.7" cy="-105" rx="7.6" ry="3.6" transform="rotate(38 4.7 -105)"/><ellipse cx="-4.1" cy="-118" rx="6.6" ry="3.6" transform="rotate(-38 -4.1 -118)"/><ellipse cx="4.1" cy="-118" rx="6.6" ry="3.6" transform="rotate(38 4.1 -118)"/><ellipse cx="0" cy="-136" rx="3.4" ry="9"/></g>
          <radialGradient id="glow" cx="50%" cy="38%" r="55%"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1200" height="270" fill="url(#glow)"/>
        <path class="h1" d="M0 150 C 160 100, 300 110, 460 150 S 760 190, 900 130 S 1120 100, 1200 130 V270 H0 Z"/>
        <ellipse class="t2" cx="330" cy="168" rx="9" ry="34"/><ellipse class="t2" cx="352" cy="176" rx="7" ry="24"/>
        <ellipse class="t2" cx="805" cy="172" rx="9" ry="36"/><ellipse class="t2" cx="830" cy="180" rx="7" ry="25"/>
        <path class="h2" d="M0 195 C 200 150, 380 170, 560 200 S 900 230, 1060 180 S 1160 170, 1200 180 V270 H0 Z"/>
        <ellipse class="t" cx="440" cy="205" rx="14" ry="48"/><ellipse class="t" cx="472" cy="214" rx="10" ry="32"/>
        <ellipse class="t" cx="745" cy="212" rx="14" ry="50"/><ellipse class="t" cx="716" cy="220" rx="10" ry="33"/>
        <ellipse class="t" cx="220" cy="205" rx="13" ry="44"/><ellipse class="t" cx="960" cy="208" rx="14" ry="46"/>
        <path class="h3" d="M0 235 C 220 205, 420 225, 640 242 S 980 250, 1200 225 V270 H0 Z"/>
        <use href="#fern" class="f" transform="translate(60 262) scale(1.55)"/>
        <use href="#fern" class="f" transform="translate(150 266) scale(1.05)"/>
        <use href="#fern" class="f" transform="translate(1140 262) scale(1.6)"/>
        <use href="#fern" class="f" transform="translate(1050 268) scale(1.0)"/>
        <use href="#fern" class="f" transform="translate(395 270) scale(0.9)"/>
        <use href="#fern" class="f" transform="translate(800 270) scale(0.95)"/>
      </svg>
      <div class="banner-text">
        <p class="eyebrow">You've read</p>
        <p class="big" id="heroMain">&mdash;</p>
        <p class="sub" id="heroSub"></p>
      </div>
    </section>

    <section aria-label="Titles by status">
      <div class="seg" id="seg" role="img" aria-label="Titles by status"></div>
      <div class="legend" id="legend"></div>
    </section>

    <div class="cols">
      <aside class="rail">
        <nav aria-label="Filter by status"><div class="chips" id="chips" role="group" aria-label="Filter by status"></div></nav>
        <div class="railbtns">
          <button class="btn primary" id="addbtn" type="button">Add title</button>
          <button class="btn" id="exportbtn" type="button">Export backup</button>
          <button class="btn" id="importbtn" type="button">Import</button>
          <input type="file" id="importfile" accept="application/json,.json,.csv,text/csv" hidden>
        </div>
      </aside>

      <div class="content">
        <div class="toolbar">
          <div class="grow"><label for="q" hidden>Search titles</label><input type="search" id="q" placeholder="Search title, site or note"></div>
          <label for="sort" hidden>Sort</label>
          <select id="sort">
            <option value="recent">Recently updated</option>
            <option value="title">Title A to Z</option>
            <option value="chapters">Most chapters read</option>
          </select>
        </div>
        <section class="panel" id="addpanel" hidden aria-label="Add a title"></section>
        <main id="list" class="grid"></main>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  /* Supabase URL and key come from config.js, so this file can be replaced freely. */
  var CFG = window.MANHWA_CONFIG || {};
  var SUPABASE_URL = CFG.supabaseUrl || '';
  var SUPABASE_KEY = CFG.supabaseKey || '';
  var TABLE = 'items';

  var STATUSES = [
    { k: 'reading', l: 'Reading' },
    { k: 'completed', l: 'Completed' },
    { k: 'hold', l: 'On hold' },
    { k: 'dropped', l: 'Dropped' },
    { k: 'plan', l: 'Plan to read' }
  ];
  var LABEL = {}; STATUSES.forEach(function (s) { LABEL[s.k] = s.l; });
  var COLLECTION = 'manhwa';

  var db = null, canWrite = true, loaded = false;
  var rows = [], filter = 'all', query = '', sortBy = 'recent';
  var editingId = null, draft = null, confirmDel = null, adding = false, newDraft = blank();
  var pendingRender = false, totalEditId = null, signedIn = false;
  var listEl = document.getElementById('list');

  function blank() { return { title: '', chapter: '0', total: '', sites: '', status: 'reading', note: '', cover: '' }; }

  function h(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (k === 'class') e.className = v;
      else if (k === 'value' || k === 'disabled' || k === 'checked' || k === 'selected') e[k] = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) add(e, arguments[i]);
    return e;
  }
  function add(e, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }

  var msgEl = document.getElementById('msg'), msgTimer = null;
  function say(text, isErr) {
    msgEl.textContent = text || '';
    msgEl.className = 'msg' + (isErr ? ' err' : '');
    clearTimeout(msgTimer);
    if (text && !isErr) msgTimer = setTimeout(function () { msgEl.textContent = ''; }, 3500);
  }

  function parse(d) {
    var title = (d.title || '').trim();
    if (!title) return { error: 'Add a title first.' };
    var ch = parseInt(d.chapter, 10); if (!(ch >= 0)) ch = 0;
    var total = parseInt(d.total, 10); total = total > 0 ? total : null;
    var sites = String(d.sites || '').split(/[,\n]/).map(function (s) { return s.trim(); }).filter(Boolean);
    return { value: { title: title, chapter: ch, total: total, sites: sites, status: d.status || 'reading', note: (d.note || '').trim(), cover: d.cover || '' } };
  }

  function resizeCover(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 300 / img.width, 450 / img.height);
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

  /* ---------- storage: Supabase ---------- */
  var sb = null;
  function supabaseDb() {
    var cache = {}, subs = [], ready = false;
    function snap() {
      return { docs: Object.keys(cache).map(function (id) { var v = cache[id]; return { id: id, data: function () { return v; } }; }), metadata: { fromCache: false } };
    }
    function emit() { if (ready) subs.forEach(function (f) { f(snap()); }); }
    function run(builder) { return Promise.resolve(builder).then(function (r) { if (r && r.error) throw r.error; return r; }); }
    function load() {
      return run(sb.from(TABLE).select('id, data')).then(function (r) {
        var o = {}; (r.data || []).forEach(function (x) { o[x.id] = x.data; });
        cache = o; ready = true; emit();
      });
    }
    function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    return {
      all: function () { return cache; },
      load: load,
      reset: function () { cache = {}; ready = false; },
      importAll: function (o) {
        var rowsOut = Object.keys(o).map(function (k) { return { id: k, data: o[k] }; });
        return run(sb.from(TABLE).upsert(rowsOut)).then(load);
      },
      collection: function () {
        return {
          onSnapshot: function (next) { subs.push(next); if (ready) setTimeout(function () { next(snap()); }, 0); return function () {}; },
          add: function (v) {
            var id = newId(); cache[id] = v; emit();
            return run(sb.from(TABLE).insert({ id: id, data: v })).catch(function (e) { delete cache[id]; emit(); throw e; });
          }
        };
      },
      doc: function (path) {
        var id = path.split('/')[1];
        return {
          update: function (p) {
            var before = cache[id]; if (!before) return Promise.resolve();
            var merged = Object.assign({}, before, p); cache[id] = merged; emit();
            return run(sb.from(TABLE).update({ data: merged }).eq('id', id)).catch(function (e) { cache[id] = before; emit(); throw e; });
          },
          delete: function () {
            var before = cache[id]; delete cache[id]; emit();
            return run(sb.from(TABLE).delete().eq('id', id)).catch(function (e) { if (before) cache[id] = before; emit(); throw e; });
          }
        };
      }
    };
  }

  /* Comick "my list" CSV: hid,title,type,rating,origination,read,last_read,... */
  function parseCsv(text) {
    var out = [], row = [], cur = '', q = false, i = 0;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for (; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = ''; out.push(row); row = [];
      } else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); out.push(row); }
    return out.filter(function (r) { return r.some(function (x) { return x.trim() !== ''; }); });
  }
  var COMICK_STATUS = { 'reading': 'reading', 'completed': 'completed', 'on-hold': 'hold', 'on hold': 'hold', 'dropped': 'dropped', 'plan to read': 'plan' };
  function comickToItems(text) {
    var rowsCsv = parseCsv(text);
    if (!rowsCsv.length) return null;
    var head = rowsCsv[0].map(function (x) { return x.trim().toLowerCase(); });
    var ix = function (n) { return head.indexOf(n); };
    if (ix('title') < 0 || ix('hid') < 0) return null;
    var items = {};
    rowsCsv.slice(1).forEach(function (r) {
      var title = (r[ix('title')] || '').trim(), hid = (r[ix('hid')] || '').trim();
      if (!title || !/^[A-Za-z0-9_-]{1,64}$/.test(hid)) return;
      var ch = parseFloat(r[ix('read')]); ch = ch > 0 ? Math.floor(ch) : 0;
      var when = Date.parse(r[ix('last_read')] || ''); 
      var type = (r[ix('origination')] || '').trim();
      items[hid] = {
        title: title, chapter: ch, total: null, sites: [],
        status: COMICK_STATUS[(r[ix('type')] || '').trim().toLowerCase()] || 'reading',
        note: type && type.toLowerCase() !== 'manhwa' ? type : '',
        cover: '', updated: when > 0 ? when : 0
      };
    });
    return items;
  }

  document.getElementById('importfile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var text = String(r.result || ''), good = {}, n = 0, skipped = 0, o = null;
      var isCsv = /\.csv$/i.test(f.name) || (text.replace(/^﻿/, '').trim().charAt(0) !== '{');
      if (isCsv) {
        o = comickToItems(text);
        if (!o) { say('That CSV is not a Comick list export.', true); e.target.value = ''; return; }
        var have = db.all();
        Object.keys(o).forEach(function (k) { if (have[k]) skipped++; else { good[k] = o[k]; n++; } });
      } else {
        try { o = JSON.parse(text); } catch (x) { o = null; }
        if (!o || typeof o !== 'object' || Array.isArray(o)) { say('That file is not a Reading Tracker backup.', true); e.target.value = ''; return; }
        Object.keys(o).forEach(function (k) { if (o[k] && typeof o[k].title === 'string') { good[k] = o[k]; n++; } });
      }
      if (!n) { say(skipped ? 'Everything in that file is already in your list.' : 'That file has no titles in it.', true); e.target.value = ''; return; }
      db.importAll(good).then(function () {
        say('Imported ' + n + (n === 1 ? ' title' : ' titles') + (skipped ? ', skipped ' + skipped + ' already in your list.' : '.'));
      }).catch(function () { say('Import failed. Check your connection and try again.', true); });
      e.target.value = '';
    };
    r.readAsText(f);
  });

  renderChips();
  start();
})();
</script>

</body>
</html>
